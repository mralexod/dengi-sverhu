name: Разведка для статей (подсказки + топ-10)

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Запросы через |"
        required: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Собрать подсказки и топ
        env:
          SEEDS: ${{ inputs.seeds }}
        run: python3 src/seo_research.py
      - name: Сохранить
        run: |
          git config user.name "seo-research"
          git config user.email "seo-research@users.noreply.github.com"
          git add seo/
          git commit -m "SEO: разведка $(date +%F)" || exit 0
          git pull --rebase && git push
