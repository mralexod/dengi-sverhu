name: Автопостинг в канал

on:
  schedule:
    - cron: "30 6 * * *"   # 09:30 по Москве, каждый день
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать пост, не отправлять"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tg-autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать пост дня
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python3 autopost/send.py
      - name: Запомнить отправленное
        run: |
          if ! git diff --quiet autopost/sent.txt; then
            git config user.name "autopost"
            git config user.email "autopost@users.noreply.github.com"
            git add autopost/sent.txt
            git commit -m "Автопостинг: отмечен отправленный пост"
            git push
          fi
